[package]
name = "google-cloud-shell-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Google Cloud Shell from your terminal: ssh, scp and an ssh ProxyCommand, without the gcloud SDK"
authors = ["Aero <aero.windwalker@gmail.com>"]
license = "MIT"
repository = "https://github.com/aeroxy/google-cloud-shell-cli"
homepage = "https://github.com/aeroxy/google-cloud-shell-cli"
documentation = "https://github.com/aeroxy/google-cloud-shell-cli#readme"
keywords = ["google-cloud", "cloud-shell", "gcloud", "ssh", "gcp"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "gcs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "time", "process", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3.27.0"
